  </div>

<script>
const fader = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.08, rootMargin: '0px 0px -48px 0px' });
document.querySelectorAll('.fade').forEach(el => fader.observe(el));
</script>
<script>
(function(){var b=document.getElementById('navBurger'),m=document.getElementById('mobileMenu');if(!b)return;b.addEventListener('click',function(){b.classList.toggle('open');m.classList.toggle('open');document.body.style.overflow=m.classList.contains('open')?'hidden':'';});})();
</script>
<script>
(function(){
  var lb = document.getElementById('lightbox');
  var cap = document.getElementById('lightboxCaption');
  var close = document.getElementById('lightboxClose');
  document.querySelectorAll('[data-lightbox]').forEach(function(card){
    card.addEventListener('click', function(){
      cap.textContent = card.getAttribute('data-caption') || '';
      lb.classList.add('open');
    });
  });
  function closeLb(){ lb.classList.remove('open'); }
  close.addEventListener('click', closeLb);
  lb.addEventListener('click', function(e){ if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });
})();
</script>
